
spotless {

    format "misc", {
        // define the files to apply `misc` to
        target "*.gradle", "*.md", ".gitignore"

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces() // or spaces. Takes an integer argument if you don"t like 4
        endWithNewline()
    }
    java {
        // export config file: https://github.com/diffplug/spotless/blob/main/ECLIPSE_SCREENSHOTS.md#creating-spotlessimportorder
        importOrderFile('src/test/resources/spotless/importorder.properties') // import order file as exported from eclipse
        // removes any unused imports
        removeUnusedImports()
        eclipse("4.21").configFile("src/test/resources/spotless/alpharo-formatter.xml")
        // Enforces the MIT header, as jobj-reflect does (astrapi69/jobj-reflect#13): the release 3.2
        // migration removed the license plugin and left no step that checks it, so a missing or changed
        // header went unnoticed (#20). The text is the header the sources carry.
        licenseHeaderFile(rootProject.file("src/main/resources/license-header.txt"))
    }
}
